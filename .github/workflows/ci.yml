name: Core API CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore src/Aevo.CoreApi/Aevo.CoreApi.csproj
      - run: dotnet build src/Aevo.CoreApi/Aevo.CoreApi.csproj --configuration Release --no-restore
      - run: dotnet test src/Aevo.CoreApi/Aevo.CoreApi.csproj --configuration Release --no-restore
